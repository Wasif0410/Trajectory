name: Publish from bank

# Every day should end with one professional, one personal and one cool fact.
# This draws one from each category in the private bank, committing each
# separately.
#
# Writing your own entry wins: a category already filed for today is left
# alone and the bank fills the rest.
#
# If the day cannot be completed, an issue is raised naming the categories
# that came up short. An incomplete day is a problem to fix, not something to
# absorb quietly.
#
# 05:30 UTC is 01:30 in Toronto during EDT and 00:30 during EST. After
# midnight on purpose: this run is about the day that just ended, not the one
# it wakes up in.
#
# The old 22:30 run read the clock to decide which day it was publishing for,
# leaving it only 90 minutes of slack before midnight. GitHub delivers
# scheduled triggers late — usually under an hour, but nine to twelve hours
# during the incident of 2026-08-27 — and once the delay crossed midnight the
# run published for the following day instead. It did not fail; it succeeded
# at the wrong thing, and 2026-08-26 was left permanently empty.
#
# Naming the target date explicitly turns 90 minutes of slack into about 22
# hours, and the two-day repair pass below covers anything worse.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Parse and validate the bank without publishing
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BANK_TOKEN }}

      - name: Check out bank
        uses: actions/checkout@v4
        with:
          repository: Wasif0410/Trajectory-Bank
          token: ${{ secrets.BANK_TOKEN }}
          path: bank

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw one entry per category
        id: draw
        env:
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: |
          git config user.name "Wasif Saeed"
          git config user.email "115382944+Wasif0410@users.noreply.github.com"
          git -C bank config user.name "Wasif Saeed"
          git -C bank config user.email "115382944+Wasif0410@users.noreply.github.com"

          # The day's entries go through a branch and a pull request, matching
          # what the /trajectory skill does by hand. If one path used a branch
          # and the other committed straight to main, the history would show at
          # a glance which days were written and which were drawn.
          # The day this run is about, not the day it happens to wake up on.
          target=$(TZ=America/Toronto date -d yesterday +%F)
          prev=$(TZ=America/Toronto date -d '2 days ago' +%F)

          branch="log/$target"
          git switch -c "$branch"

          published=0

          # Oldest first, so a night the scheduler dropped outright is repaired
          # on the next run instead of becoming a permanent gap. A day that is
          # already complete is skipped, so on an ordinary night this extra
          # pass does nothing at all.
          for date in "$prev" "$target"; do
            for category in professional personal fact; do
              echo "::group::$date $category"
              node scripts/publish-from-bank.mjs --category="$category" --date="$date" $DRY
              echo "::endgroup::"

              # A separate commit per entry, so each lands on its own.
              if [ -n "$(git status --porcelain content/entries)" ]; then
                git add content/entries
                git commit -q -F "$MESSAGE_FILE"
                published=$((published + 1))
              fi

              # Commit the dequeue locally but do NOT push it. Pushing here
              # would delete the entry from the bank before the site has it,
              # and every step that can fail comes after this point. If one
              # does, the runner is destroyed and the bank must still be intact.
              if [ -n "$(git -C bank status --porcelain)" ]; then
                git -C bank add "$category.md" log.md
                git -C bank commit -q -m "chore($category): dequeue published entry"
              fi
            done
          done

          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "date=$target" >> "$GITHUB_OUTPUT"
          echo "Published $published entries."

      - name: Open and merge the pull request
        if: steps.draw.outputs.published != '0'
        env:
          GH_TOKEN: ${{ secrets.BANK_TOKEN }}
          BRANCH: ${{ steps.draw.outputs.branch }}
          COUNT: ${{ steps.draw.outputs.published }}
          DATE: ${{ steps.draw.outputs.date }}
        run: |
          git push -q -u origin "$BRANCH"

          title=$(node scripts/publish-from-bank.mjs --pr-title --date="$DATE")
          gh pr create --base main --head "$BRANCH" \
            --title "$title" \
            --body "$COUNT $([ "$COUNT" = "1" ] && echo entry || echo entries) for $DATE."

          # Wait for CI rather than merging blind. Merging a red build would
          # deploy a broken site. The PR is opened with the PAT, which is what
          # lets CI trigger on it at all: a PR opened with the built-in
          # GITHUB_TOKEN deliberately does not start other workflows.
          #
          # The pause is for a race. Checks take a moment to register, and
          # `gh pr checks` errors out rather than waiting if none exist yet.
          sleep 15
          gh pr checks "$BRANCH" --watch --interval 10

          # --merge, not --squash: squashing would collapse the day's entries
          # into a single commit and lose the one-commit-per-entry shape.
          gh pr merge "$BRANCH" --merge --delete-branch

      # Only now is the entry safely on the site. Any failure above skips this
      # step by default, leaving the bank exactly as it was so tomorrow retries.
      - name: Dequeue from the bank
        if: steps.draw.outputs.published != '0'
        run: git -C bank push -q

      - name: Check the day is complete
        id: check
        if: ${{ !inputs.dry_run }}
        run: node scripts/publish-from-bank.mjs --report --date="${{ steps.draw.outputs.date }}"

      # Only on real runs. A dry run should leave no trace, including issues.
      - name: Flag an incomplete day
        if: steps.check.outputs.complete == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          # Reuse the open issue rather than filing a new one every night.
          existing=$(gh issue list --state open --label bank --limit 1 --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still short today. Missing: $MISSING"
            echo "Commented on existing issue #$existing."
            exit 0
          fi

          gh label create bank --description "Bank status" --color ededed --force
          gh issue create \
            --title "Today is missing: $MISSING" \
            --label bank \
            --assignee Wasif0410 \
            --body "Every day should have one professional, one personal and one cool fact. Today came up short on: **$MISSING**.

          The bank had nothing queued under those categories. Top up bank.md in Trajectory-Bank, or write them directly."
