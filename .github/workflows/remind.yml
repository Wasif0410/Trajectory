name: Nightly reminder

# A nudge at 8pm if the day is still short. The bank no longer draws until
# 01:30, so the whole evening is yours to write in — which is the point. The
# bank is the fallback, not the plan.
#
# 00:00 UTC is 20:00 in Toronto during EDT and 19:00 during EST.
#
# This runs on GITHUB_TOKEN rather than a PAT. Opening an issue needs only
# issues:write, which the built-in token has by default, so this workflow
# cannot fail the way publish-from-bank did when its PAT lacked a scope.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      # A nudge is only worth anything while there is still an evening left to
      # act on it. GitHub has delivered this trigger between one and nine hours
      # late, and an issue opened at 4am is not a reminder — it is a note about
      # a day already being decided without you. Worse, a run that drifts past
      # midnight resolves "today" to yesterday, finds it complete and closes
      # the nudge, so the day it was meant to cover never gets one at all.
      #
      # A late run is not salvageable, only skippable. This is the one part of
      # the system a correct date cannot fix: the value here is the timing.
      - name: Only nudge while the evening is still usable
        id: window
        run: |
          hour=$(TZ=America/Toronto date +%-H)

          if [ "$hour" -ge 19 ] && [ "$hour" -le 22 ]; then
            echo "Toronto hour is $hour. In the window."
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "Toronto hour is $hour, outside 19:00-22:59. Skipping the nudge."
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.send == 'true'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.send == 'true'
        with:
          node-version: 22

      - name: Check which categories are filed
        id: check
        if: steps.window.outputs.send == 'true'
        run: node scripts/publish-from-bank.mjs --report

      - name: Nudge, or clear the nudge
        if: steps.window.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPLETE: ${{ steps.check.outputs.complete }}
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          set -euo pipefail

          today=$(TZ=America/Toronto date +%F)
          title="Log today's entry — $today"

          # Listing by a label that does not exist yet is an error, so ensure it.
          gh label create reminder --description "Daily nudge" --color fbca04 --force

          # One line per open nudge: "<number> <title>". Parsed with grep and
          # awk rather than jq, so the logic is testable in a plain shell.
          open_list=$(gh issue list --state open --label reminder \
            --json number,title --template '{{range .}}{{.number}} {{.title}}{{"\n"}}{{end}}')

          # grep exits 1 on no match, which pipefail would turn into a failed
          # run on the ordinary "nothing open" day. Hence the || true.
          todays=$(echo "$open_list" | grep -F "$today" | awk '{print $1}' | head -1 || true)
          stale=$(echo "$open_list" | grep -v -F "$today" | awk 'NF {print $1}' || true)

          # Yesterday's nudges are answered by now, one way or another. A pile
          # of them is noise, and noise is how a real one gets ignored.
          for n in $stale; do
            gh issue close "$n" --comment "Superseded."
          done

          if [ "$COMPLETE" = "true" ]; then
            if [ -n "$todays" ]; then
              gh issue close "$todays" --comment "All three filed. Nice."
            fi
            echo "$today is complete."
            exit 0
          fi

          if [ -n "$todays" ]; then
            echo "Already nudged in #$todays."
            exit 0
          fi

          # Assigned, because GitHub emails on assignment. An unassigned issue
          # in a repo you own is a notification you will not receive.
          gh issue create \
            --title "$title" \
            --label reminder \
            --assignee Wasif0410 \
            --body "Still missing for $today: **$MISSING**.

          Run \`/trajectory\` to write them yourself. Anything still missing at 22:30 gets drawn from the bank instead."
